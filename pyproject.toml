[project]
name = "minimal-chromium-browser"
version = "0.1.0"
description = "Minimal desktop browser prototype built with Python, Qt, and Chromium-based QtWebEngine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7,<7",
    "PyQt6-WebEngine>=6.7,<7",
]

[project.scripts]
minimal-browser = "browser:main"

[tool.ruff]
line-length = 100
target-version = "py310"
