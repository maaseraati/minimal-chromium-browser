name: Build Windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build morphine.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 + WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine qtpositioning qtwebchannel'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Stage binary + Qt runtime
        shell: cmd
        run: |
          mkdir dist
          copy build\morphine.exe dist\morphine.exe
          windeployqt --release --dir dist dist\morphine.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphine-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
