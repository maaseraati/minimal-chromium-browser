name: Build Windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build morphine.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 + WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine qtpositioning qtwebchannel'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Stage binary + Qt runtime (slim)
        shell: cmd
        run: |
          mkdir dist
          copy build\morphine.exe dist\morphine.exe
          windeployqt ^
            --release ^
            --no-translations ^
            --no-system-d3d-compiler ^
            --no-compiler-runtime ^
            --no-opengl-sw ^
            --no-quick-import ^
            --skip-plugin-types sqldrivers,sceneparsers,texttospeech,multimedia,generic ^
            --dir dist dist\morphine.exe

      - name: Trim QtWebEngine + plugin payload
        shell: pwsh
        run: |
          # Strip Chromium locales (keep en-US + ru)
          Get-ChildItem -Path dist -Recurse -Filter "qtwebengine_locales" -Directory | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Filter "*.pak" |
              Where-Object { $_.BaseName -notin @("en-US","ru") } |
              Remove-Item -Force
          }

          # Strip Qt's own .qm translations (defensive vs --no-translations)
          Get-ChildItem -Path dist -Recurse -Filter "*.qm" -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Drop the F12 devtools pak (~10 MB) and the 2x HiDPI pak (we run desktop only).
          $extraPaks = @(
            "qtwebengine_devtools_resources.pak",
            "qtwebengine_resources_200p.pak"
          )
          foreach ($name in $extraPaks) {
            Get-ChildItem -Path dist -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          # Trim unused Qt image format plugins (keep png implicit, plus svg/jpeg/gif/ico).
          $imgKeep = @("qsvg.dll","qjpeg.dll","qgif.dll","qico.dll")
          $imgDir  = Join-Path dist "imageformats"
          if (Test-Path $imgDir) {
            Get-ChildItem -Path $imgDir -Filter "*.dll" |
              Where-Object { $_.Name -notin $imgKeep } |
              Remove-Item -Force
          }

      - name: Show dist size
        shell: pwsh
        run: |
          $size = (Get-ChildItem -Path dist -Recurse | Measure-Object -Property Length -Sum).Sum
          "{0:N1} MB on disk" -f ($size / 1MB)
          Get-ChildItem -Path dist -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 15 FullName, Length

      - name: Pack dist as zip
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath morphine-windows-x64.zip -CompressionLevel Optimal
          $z = Get-Item morphine-windows-x64.zip
          "{0:N1} MB packed" -f ($z.Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphine-windows-x64
          path: morphine-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
