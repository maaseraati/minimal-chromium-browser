name: Build Windows EXE

on:
  push:
    branches: ["devin/**", "main"]
  pull_request:
    branches: ["main", "devin/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --name MinimalBrowser --windowed --onefile --add-data "morphine_logo.png;." browser.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalBrowser-windows
          path: dist/MinimalBrowser.exe
          retention-days: 30
